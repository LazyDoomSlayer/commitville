<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <meta name="description" content="Commitville is an autonomous pixel-art office simulation." />
    <title>Commitville</title>
  </head>
  <body>
    <main id="app" aria-label="Commitville office simulation">
      <div id="game" aria-hidden="true"></div>
      <section class="hud">
        <div>
          <p class="hud__eyebrow">Autonomous office simulation</p>
          <h1>Commitville</h1>
        </div>
        <time id="world-clock" class="hud__clock">MON 08:00</time>
      </section>
      <aside class="office-status" aria-label="Dnake's activity">
        <span class="office-status__eyebrow"
          ><span class="status-dot"></span> DNAKE <span id="dnake-status">On rounds</span></span
        >
        <p id="dnake-activity" aria-live="polite">Welcoming you to the office</p>
      </aside>
      <nav class="camera-controls" aria-label="Office camera">
        <div class="camera-controls__zoom">
          <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out (−)">−</button>
          <output id="zoom-value" aria-label="Camera zoom">100%</output>
          <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
        </div>
        <button id="fit-office" type="button" title="Fit office (0)">Fit office</button>
        <button id="follow-dnake" type="button" aria-pressed="false" title="Follow Dnake (F)">
          Follow Dnake
        </button>
      </nav>
      <p id="art-credit" class="art-credit" hidden></p>
      <noscript>Commitville requires JavaScript to run.</noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
